# Configuración de despliegue en Netlify.
# El sistema dejó de ser un .html estático: ahora es un monorepo Vite + React
# (workspaces npm). Netlify instala en la raíz, compila el workspace web y publica
# la carpeta resultante.

[build]
  command = "npm run build"      # raíz → compila @renovacell/web (vite build)
  publish = "apps/web/dist"      # salida del build (index.html, assets, products, brand, landing)

[build.environment]
  NODE_VERSION = "20"

# ── Cabeceras de seguridad (auditoría M-01) ─────────────────────────────────
# Conjunto conservador: NO restringe scripts/estilos (no rompe el SPA ni la landing con
# scripts inline). frame-ancestors 'self' evita que el panel se incruste en un sitio ajeno
# (clickjacking); object-src/base-uri cierran vectores clásicos. Una CSP de script-src con
# nonces/hashes queda como endurecimiento posterior (requiere ajustar la landing).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(self)"
    Content-Security-Policy = "frame-ancestors 'self'; object-src 'none'; base-uri 'self'"

# ── Enrutado por HOSTNAME → Edge Function `host-router` ───────────────────────
# El matching por dominio NO se hace aquí: en netlify.toml `from` es un PATH y no
# admite el hostname (las reglas `from="https://sistema.renovacell.mx/"` NUNCA
# matchean). El enrutado por host lo resuelve `netlify/edge-functions/host-router.ts`,
# que lee el Host real y corre ANTES de estos redirects:
#   sistema.renovacell.mx / portal.renovacell.mx  (raíz)  -> 301 /sistema
#   www / .com.mx / goldenplacenta (legado)               -> 301 https://renovacell.mx
#   renovacell.mx y *.netlify.app                         -> passthrough (reglas de abajo)
# Un hostname NO autoriza: la autoridad sigue siendo RLS/roles del backend.

# ── Reglas genéricas de PATH (renovacell.mx canónico + *.netlify.app) ─────────
# La LANDING es la cara pública: el doctor teclea el dominio y debe verla.
# El SISTEMA vive bajo /sistema — se instala en el celular y se abre desde su
# ícono, así que su dirección no necesita ser corta ni memorizable.

# 1) Raíz → landing. `force` es indispensable: sin él Netlify sirve el
#    index.html del sistema (que existe en disco) e ignora esta regla.
[[redirects]]
  from = "/"
  to = "/landing/index.html"
  status = 200
  force = true

# 2) El sistema. Cualquier ruta bajo /sistema entra a la app, que enruta del
#    lado del cliente (no usa rutas de servidor).
[[redirects]]
  from = "/sistema"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/sistema/*"
  to = "/index.html"
  status = 200

# 3) /landing sigue sirviéndose como archivo (lo usa la vista previa del editor
#    en Administración), pero ya no es la dirección pública.
[[redirects]]
  from = "/landing"
  to = "/"
  status = 301

# 4) Cualquier otra ruta cae en la landing, no en un 404 crudo. Los archivos
#    reales (/assets, /products, /brand) se sirven antes que esta regla.
[[redirects]]
  from = "/*"
  to = "/landing/index.html"
  status = 200